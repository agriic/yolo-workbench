<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Sign in · YOLO Workbench</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%230c7a63' stroke-width='2.4' stroke-linecap='round'%3E%3Crect x='4' y='4' width='16' height='16' rx='2'/%3E%3Crect x='9' y='9' width='11' height='11' rx='1.4' fill='%230c7a63' stroke='none' opacity='.35'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/styles.css">
  <script>
    if (localStorage.getItem("theme") === "dark") document.documentElement.dataset.theme = "dark";
  </script>
</head>
<body class="login-page">
  <main class="login-main">
    <form id="login-form" class="login-card" novalidate>
      <div class="brand">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="2"/><rect x="9" y="9" width="11" height="11" rx="1.4" fill="currentColor" stroke="none" opacity=".3"/></svg>
        <strong>YOLO Workbench</strong>
      </div>
      <h1>Sign in</h1>
      <label class="field">User name<input name="name" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus></label>
      <label class="field">Password<input name="password" type="password" autocomplete="current-password" required></label>
      <p id="login-error" class="warn-text" role="alert" hidden></p>
      <button id="login-submit" class="primary-btn" type="submit">Sign in</button>
      <p class="login-note muted">Ask the person who runs this server for an account.</p>
    </form>
  </main>
  <script type="module" src="/login.js"></script>
</body>
</html>
