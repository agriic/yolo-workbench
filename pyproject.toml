[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "yolo-workbench"
version = "0.1.0"
description = "Local YOLO dataset annotation, exploration, and repair tool"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115",
  "pillow>=10",
  "pydantic>=2.7",
  "pyyaml>=6",
  "typer>=0.12",
  "uvicorn>=0.30",
  # embeddings
  "fiftyone>=0.25",
  "umap-learn>=0.5",
  "protobuf>=4",
  "torch>=2",
  "torchvision>=0.17",
  # model-assisted labeling
  "ultralytics>=8",
  # tests
  "httpx>=0.27",
  "pytest>=8",
]

[project.scripts]
yolo-workbench = "yolo_workbench.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/yolo_workbench"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

# PyPI's Windows torch wheels are CPU-only; Linux ones already bundle CUDA 13.0, so match that on Windows
[tool.uv.sources]
torch = [{ index = "pytorch-cu130", marker = "sys_platform == 'win32'" }]
torchvision = [{ index = "pytorch-cu130", marker = "sys_platform == 'win32'" }]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
