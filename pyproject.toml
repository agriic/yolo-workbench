[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "yolo-workbench"
version = "0.1.0"
description = "YOLO dataset annotation, exploration, repair and training workbench (desktop or server)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115",
  "pillow>=10",
  "pydantic>=2.7",
  "pyyaml>=6",
  "typer>=0.12",
  "uvicorn>=0.30",
  # training runner supervision (process identity, tree kill on Windows)
  "psutil>=5.9",
  # server configuration file (tomllib is in the standard library from 3.11)
  "tomli>=2; python_version < '3.11'",
  # embeddings
  "fiftyone>=0.25",
  "umap-learn>=0.5",
  "protobuf>=4",
  "torch>=2",
  "torchvision>=0.17",
  # model-assisted labeling and training
  "ultralytics>=8",
  # once imported, Ultralytics patches Image.open to load pi-heif on the first unreadable image (and pip-installs it if missing)
  "pi-heif>=0.18",
  # RF-DETR training and prediction (augment: Albumentations for custom aug_config); the runner uses its Lightning internals, so stay on a tested minor
  "rfdetr[train,onnx,augment]>=1.11.2,<1.12",
  # ONNX export of trained weights (rfdetr[onnx] brings onnx + onnxruntime; Ultralytics simplifies with onnxslim)
  "onnxslim>=0.1.82",
]

[dependency-groups]
# installed by `uv sync`; a server release leaves them out with `uv sync --frozen --no-dev`
dev = [
  "httpx>=0.27",
  "pytest>=8",
]

[project.scripts]
yolo-workbench = "yolo_workbench.cli:app"
yolo-workbench-server = "yolo_workbench.server:app"

[tool.hatch.build.targets.wheel]
packages = ["src/yolo_workbench"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

# ultralytics wants opencv-python, fiftyone opencv-python-headless (<5); both install the same cv2/ package
# and a mixed install breaks `import cv2`, so drop opencv-python (the marker never matches) and keep headless
[tool.uv]
override-dependencies = ["opencv-python; sys_platform == 'never'"]

# PyPI's Windows torch wheels are CPU-only; Linux ones already bundle CUDA 13.0, so match that on Windows
[tool.uv.sources]
torch = [{ index = "pytorch-cu130", marker = "sys_platform == 'win32'" }]
torchvision = [{ index = "pytorch-cu130", marker = "sys_platform == 'win32'" }]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
